<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RafaConecta · Banco de capturas</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; padding: 20px;
    background: #e9e6e3;
    font: 500 13px/1.4 'Inter', system-ui, sans-serif;
    color: #211a18;
  }
  .fila { display: flex; gap: 20px; justify-content: center; align-items: flex-start; }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
  figcaption { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6b5e57; }
  .telefono {
    width: 390px; height: 720px;
    border: 10px solid #211a18; border-radius: 34px;
    overflow: hidden; background: #fff;
    box-shadow: 0 18px 40px rgba(0,0,0,.22);
  }
  iframe { width: 390px; height: 700px; border: 0; display: block; }
</style>
</head>
<body>
  <div class="fila">
    <figure>
      <div class="telefono"><iframe id="f-claro" src="/index.html" title="RafaConecta en tema claro"></iframe></div>
      <figcaption>Móvil · tema claro</figcaption>
    </figure>
    <figure>
      <div class="telefono"><iframe id="f-oscuro" src="/index.html" title="RafaConecta en tema oscuro"></iframe></div>
      <figcaption>Móvil · tema oscuro</figcaption>
    </figure>
  </div>

<script>
// Pinta en cada iframe un estado de sesión representativo, con el mismo marcado
// que generan las plantillas de app.js. No toca Firebase.
const SVG = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' width='800' height='500'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#d9e9f2'/><stop offset='1' stop-color='#f3dede'/></linearGradient></defs><rect width='800' height='500' fill='url(#g)'/><circle cx='250' cy='170' r='68' fill='#fff' opacity='.55'/><path d='M60 430 L300 230 L470 380 L610 285 L770 430 Z' fill='#fff' opacity='.45'/></svg>");

function montar(doc, tema) {
  const $ = (id) => doc.getElementById(id);
  if (!$('app-container')) return false;

  doc.documentElement.setAttribute('data-theme', tema);

  // Solo para la maqueta: oculta la barra de desplazamiento del navegador de
  // escritorio, que en un teléfono real es superpuesta y no se ve.
  if (!doc.getElementById('maqueta-sin-barra')) {
    const s = doc.createElement('style');
    s.id = 'maqueta-sin-barra';
    s.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar{display:none}';
    doc.head.appendChild(s);
  }
  $('auth-loading-screen')?.classList.remove('active');
  $('login-screen')?.classList.remove('active');
  $('app-container').style.display = 'block';

  $('header-username').textContent = 'Tomás Valencia';
  $('header-avatar').src = '/logo.png';
  $('inline-avatar').src = '/logo.png';

  doc.querySelectorAll('.admin-only').forEach(b => b.style.display = b.id === 'add-event-btn' ? 'inline-flex' : 'flex');
  doc.querySelectorAll('.teacher-chat-only').forEach(e => e.style.display = 'flex');
  doc.querySelectorAll('.moderation-only').forEach(e => e.style.display = 'flex');
  const mc = $('moderation-count');
  if (mc) { mc.hidden = false; mc.textContent = '3'; }

  $('teacher-messages-list').innerHTML =
    '<div class="teacher-message"><strong>Prof. Carlos Rojas</strong>' +
    '<p>Recuerden entregar el taller de ciencias el viernes antes de las 2:00 p.m.</p>' +
    '<small>Hace 2 horas</small></div>';

  const post = (id, nombre, tiempo, texto, likes, coment, liked, img, abierto) =>
    '<article class="post-card" id="post-' + id + '">' +
      '<div class="post-header"><div class="user-info">' +
        '<img src="/logo.png" alt="Avatar" class="avatar">' +
        '<div class="user-details"><span class="username">' + nombre + '</span>' +
        '<span class="post-meta">' + tiempo + '</span></div></div>' +
        '<button class="action-btn delete-post-btn" data-id="' + id + '"><i class="bx bx-trash"></i></button>' +
      '</div>' +
      '<div class="post-content">' + texto + '</div>' +
      (img ? '<img src="' + SVG + '" class="post-image-full" alt="Imagen de la publicación">' : '') +
      '<div class="post-actions">' +
        '<button class="action-btn like-btn ' + (liked ? 'liked' : '') + '" data-id="' + id + '">' +
        '<i class="bx ' + (liked ? 'bxs-heart' : 'bx-heart') + '"></i><span class="likes-count">' + likes + '</span></button>' +
        '<button class="action-btn comment-btn" data-id="' + id + '"><i class="bx bx-message-rounded"></i>' + coment + '</button>' +
      '</div>' +
      '<div class="comments-section' + (abierto ? ' visible' : '') + '" id="comments-' + id + '">' +
        '<div class="comments-list"><div class="comment">' +
          '<img src="/logo.png" class="avatar-small" alt="">' +
          '<div class="comment-content"><div class="comment-text-group">' +
          '<strong>Diego Pérez</strong><span>¡Allí estaremos puntuales!</span></div></div>' +
        '</div></div>' +
        '<div class="comment-input-area">' +
          '<input type="text" placeholder="Escribe un comentario..." class="new-comment-input" data-id="' + id + '">' +
          '<button class="comment-submit-btn" data-id="' + id + '"><i class="bx bxs-send"></i></button>' +
        '</div>' +
      '</div>' +
    '</article>';

  $('posts-container').innerHTML =
    post('a', 'Laura Gómez', 'Hace 10 minutos',
         'Mañana tendremos ensayo para el acto cultural en el patio central. ¡No olviden traer el material!',
         24, 6, true, true, true) +
    post('b', 'Rectoría', 'Hace 5 horas',
         'Se aplaza la jornada deportiva al próximo martes por condiciones del clima.',
         8, 2, false, false, false);

  $('news-container').innerHTML =
    '<div><strong>Matrículas 2027</strong><p class="post-meta">Abiertas hasta el 30 de noviembre.</p></div>';
  $('reports-container').innerHTML =
    '<div><strong>Boletines P3</strong> <span class="badge">Disponible</span></div>';
  return true;
}

function cuandoCargue(iframe, tema) {
  const intenta = () => {
    try {
      if (!montar(iframe.contentDocument, tema)) setTimeout(intenta, 120);
    } catch (e) { setTimeout(intenta, 120); }
  };
  iframe.addEventListener('load', intenta);
  intenta();
}

cuandoCargue(document.getElementById('f-claro'), 'light');
cuandoCargue(document.getElementById('f-oscuro'), 'dark');
</script>
</body>
</html>
