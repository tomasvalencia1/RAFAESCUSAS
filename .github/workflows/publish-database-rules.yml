name: Asegurar índices de la base de datos

on:
  push:
    branches: [main]
    paths: [database.rules.json, functions/publish-database-rules.cjs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-reglas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar Firebase Admin
        run: npm ci --prefix functions

      - name: Aplicar índices y permisos declarados a las reglas vivas
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node functions/publish-database-rules.cjs
