name: Asegurar índices de la base de datos

on:
  push:
    branches: [main]
    paths: [database.rules.json, functions/publish-database-rules.cjs, functions/reglas-seguridad.cjs, functions/migrar-datos.cjs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-reglas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar Firebase Admin
        run: npm ci --prefix functions

      # Primero los datos: las cuentas existentes deben quedar aprobadas ANTES de que
      # las reglas lo exijan, o perderian el acceso durante unos segundos. La cuenta
      # de servicio escribe sin pasar por las reglas, asi que el orden es seguro.
      - name: Migrar los datos a la nueva estructura
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node functions/migrar-datos.cjs

      # Solo se ejecuta si la migracion termino bien (un paso fallido detiene el job).
      - name: Aplicar índices y permisos declarados a las reglas vivas
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node functions/publish-database-rules.cjs
